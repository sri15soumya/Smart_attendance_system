<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — AttendX</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <span class="dot"></span> AttendX
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Login</a></li>
      <li><a href="register.html" class="active">Register</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="card">
      <p class="card-title">Create account</p>
      <p class="card-sub">Join AttendX to manage or track attendance.</p>

      <p style="font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:8px;">I am a</p>
      <div class="role-toggle" id="roleToggle">
        <button class="role-btn selected" onclick="selectRole('student', this)">Student</button>
        <button class="role-btn" onclick="selectRole('faculty', this)">Faculty</button>
      </div>
      <input type="hidden" id="role" value="student" />

      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" />
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" />
      </div>

      <button class="btn btn-primary" onclick="register()">Create account</button>

      <p class="link-text">
        Already have an account? <a href="index.html">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    function selectRole(role, el) {
      document.getElementById('role').value = role;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
    }
  </script>
  <script src="js/register.js"></script>
</body>
</html>
