<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard — AttendX</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <span class="dot"></span> AttendX
    </a>
    <ul class="nav-links">
      <li><a href="student.html" class="active">Dashboard <span class="nav-badge">Student</span></a></li>
      <li><a href="index.html">Logout</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="page-header">
      <h1>Student Dashboard</h1>
      <p>Scan the QR code displayed by your faculty to mark attendance.</p>
    </div>

    <div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1.2rem;">
        <div>
          <p style="font-family:var(--font-head); font-size:16px; font-weight:600;">QR Scanner</p>
          <p style="font-size:13px; color:var(--text-muted); margin-top:2px;">Point your camera at the session QR code</p>
        </div>
        <span class="chip chip-idle" id="scanStatus">Ready</span>
      </div>

      <div id="reader"></div>

      <p style="text-align:center; font-size:13px; color:var(--text-muted); margin-top:1rem;" id="scanMsg">
        Scanner will activate automatically.
      </p>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="js/student.js"></script>
</body>
</html>
